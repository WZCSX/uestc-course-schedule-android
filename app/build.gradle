plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yanyi.courseschedule'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yanyi.courseschedule'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '3.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
